<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Backend Refresh</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
    rel="stylesheet"
  />
  <script>
    (function disableDashboardServiceWorkerForAdmin() {
      if (!('serviceWorker' in navigator) || !window.sessionStorage) return;
      var reloadKey = 'backend-refresh-sw-reset';
      if (sessionStorage.getItem(reloadKey) === 'done') return;
      navigator.serviceWorker
        .getRegistrations()
        .then(function(registrations) {
          var dashboardRegistrations = registrations.filter(function(registration) {
            var scriptUrl =
              (registration.active && registration.active.scriptURL) ||
              (registration.waiting && registration.waiting.scriptURL) ||
              (registration.installing && registration.installing.scriptURL) ||
              '';
            return /\/service-worker\.js(?:$|\?)/.test(scriptUrl);
          });
          if (!dashboardRegistrations.length) return;
          return Promise.all(
            dashboardRegistrations.map(function(registration) {
              return registration.unregister();
            })
          ).then(function() {
            sessionStorage.setItem(reloadKey, 'done');
            window.location.reload();
          });
        })
        .catch(function() {});
    })();
  </script>
</head>
<body class="datasources-admin-page">
  <main class="datasources-admin">
    <header class="datasources-admin__header">
      <div>
        <p class="datasources-admin__eyebrow">Admin</p>
        <h1>Backend refresh</h1>
        <p class="datasources-admin__intro">
          Review stored event movement, source outcomes, and refresh health.
        </p>
      </div>
      <div class="datasources-admin__actions">
        <span id="adminAuthStatus" class="user-email"></span>
        <button type="button" id="adminLoginBtn" class="secondary">Sign in</button>
        <button type="button" id="adminLogoutBtn" class="secondary" hidden>Sign out</button>
        <a class="button secondary" href="datasources-admin.html">Event review</a>
        <button type="button" id="cacheClearBtn" class="secondary">Reset all caches</button>
      </div>
    </header>

    <section id="adminAccessNotice" class="datasources-admin__panel" hidden>
      <div class="datasources-admin__panel-header">
        <div>
          <h2>Sign in required</h2>
          <p>Use the authorized Google account to open backend refresh status.</p>
        </div>
      </div>
    </section>

    <section id="adminContent" class="datasources-admin__grid" hidden>
      <div class="datasources-admin__panel datasources-admin__panel--full">
        <div class="datasources-admin__panel-header datasources-admin__panel-header--inline">
          <div>
            <h2>Backend refresh</h2>
            <p>Stored event movement, source outcomes, and refresh triggers.</p>
          </div>
          <button type="button" id="refreshStatusBtn" class="secondary">Refresh status</button>
        </div>
        <div id="refreshStatusMessage" class="datasources-admin__status" aria-live="polite"></div>
        <div id="refreshStatusOutput" class="review-source-counts" aria-label="Backend refresh status"></div>
      </div>
    </section>
  </main>

  <script>
    (function applyLocalApiOverride() {
      if (window.showsEndpoint || window.apiBaseUrl) return;
      var host = (window.location && window.location.hostname) || '';
      var isLocalHost = host === 'localhost' || host === '127.0.0.1' || host === '::1';
      if (window.location.protocol === 'file:' || isLocalHost) {
        var origin = window.location.origin || 'http://localhost:3004';
        window.apiBaseUrl = origin;
        window.showsEndpoint = origin + '/api/shows';
      }
    })();
  </script>
  <script type="module" src="js/datasourcesAdmin.js?v=20260704-5"></script>
</body>
</html>
