<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
    <title>DMV Events</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css?v=20260702-16" />
  <link rel="modulepreload" href="js/shows.js?v=20260702-16" />
  <link rel="preload" href="data/shows-bootstrap-dmv.json?v=20260702-16" as="fetch" crossorigin="anonymous" />
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon.png">
</head>

<body>
  <section id="goalsView">
    <div id="showsPanel" class="main-layout">
      <div class="full-column">
        <div class="shows-panel-header">
          <h2>DMV Events</h2>
        </div>
        <div class="shows-toolbar">
          <div class="shows-tab-buttons" role="tablist" aria-label="Live music view">
            <button type="button" id="showsTabAll" class="shows-tab-btn is-active" data-view="all" aria-selected="true">Events</button>
            <button type="button" id="showsTabSaved" class="shows-tab-btn" data-view="saved" aria-selected="false">Saved</button>
          </div>
          <div class="shows-toolbar__actions">
            <div class="shows-toolbar__control shows-toolbar__control--distance-location">
              <div class="shows-distance-group">
                <span class="shows-location-text"></span>
              </div>
            </div>
          </div>
        </div>
        <div
          id="showsStatus"
          class="shows-status"
          role="status"
          aria-live="polite"
          hidden
        >
          <div class="shows-status__live-bars" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
        <div id="showsList" class="decision-container"></div>
      </div>
      </div>
  </section>

  <nav id="bottomNav" class="bottom-nav">
    <button type="button" id="bottomLogoutBtn" class="icon-btn">Sign In</button>
  </nav>

  <!-- Modal shown when using the bottom add button -->
  <div id="bottomAddModal" class="modal" style="display:none;">
    <div class="modal-content">
      <h3 id="bottomAddTitle"></h3>
      <div id="bottomAddOptions" class="rating-options"></div>
      <div id="bottomAddSection" class="rating-options" style="display:none;margin-top:8px;"></div>
      <input id="bottomAddText" type="text" placeholder="Description" style="display:none;margin-top:8px;width:100%;" />
      <div class="modal-actions" style="margin-top:1em;">
        <button type="button" id="bottomAddCancel">Cancel</button>
        <button type="button" id="bottomAddSubmit">Add</button>
      </div>
    </div>
  </div>
  <div id="contactModal" class="modal" style="display:none;">
    <div class="modal-content" style="max-width:400px;width:90%;max-height:80vh;overflow:auto;">
      <h3>Contact Developer</h3>
      <form id="contactForm">
        <div style="margin-bottom:8px;">
          <label>Name<br><input type="text" id="contactName" /></label>
        </div>
        <div style="margin-bottom:8px;">
          <label>Email<br><input type="email" id="contactEmailInput" required /></label>
        </div>
        <div style="margin-bottom:8px;">
          <label>Message<br><textarea id="contactMessage" required style="width:100%;height:100px;"></textarea></label>
        </div>
        <div class="modal-actions" style="margin-top:1em;">
          <button type="submit">Send</button>
          <button type="button" id="contactCancelBtn">Cancel</button>
        </div>
      </form>
    </div>
  </div>
  <script type="text/javascript">
    (() => {
      if (typeof window === 'undefined' || typeof window.location === 'undefined') return;
      const { protocol, host, origin } = window.location;
      if (!protocol || !host) return;
      const scheme = String(protocol).toLowerCase();
      if (!scheme.startsWith('http')) return;
      const normalizedOrigin = origin || `${scheme}//${host}`;
      if (!normalizedOrigin) return;
      const base = normalizedOrigin.replace(/\/$/, '');
      window.apiBaseUrl = base;
      window.showsEndpoint = `${base}/api/shows`;
    })();
  </script>
  <script type="text/javascript">
    (() => {
      const assetVersion = '20260702-16';
      if (typeof window === 'undefined') return;
      const storageKey = 'dashboardAssetVersion';
      const freshClientDoneParam = 'freshClientDone';
      const loadModule = src =>
        new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.type = 'module';
          script.src = src;
          script.onload = resolve;
          script.onerror = reject;
          document.body.appendChild(script);
        });
      const afterIdle = callback => {
        if (typeof requestIdleCallback === 'function') {
          requestIdleCallback(callback, { timeout: 1500 });
          return;
        }
        setTimeout(callback, 250);
      };
      const loadOptionalScript = src => {
        const script = document.createElement('script');
        script.async = true;
        script.src = src;
        document.body.appendChild(script);
      };
      const getStartupParams = () => {
        try {
          return new URLSearchParams(window.location.search || '');
        } catch {
          return new URLSearchParams();
        }
      };
      const shouldForceFreshClient = () => {
        const params = getStartupParams();
        const value = String(params.get('freshClient') || '').trim().toLowerCase();
        return value === '1' || value === 'true' || value === 'yes';
      };
      const buildFreshClientReloadUrl = () => {
        const url = new URL(window.location.href);
        url.searchParams.delete('freshClient');
        url.searchParams.set(freshClientDoneParam, assetVersion);
        url.searchParams.set('_', String(Date.now()));
        return url.toString();
      };
      const clearDashboardCaches = async () => {
        try {
          if (window.caches?.keys) {
            const names = await caches.keys();
            await Promise.all(
              names
                .filter(name => name.startsWith('dashboard-static-') || name.startsWith('dashboard-dynamic-') || name.startsWith('dashboard-images-'))
                .map(name => caches.delete(name))
            );
          }
        } catch (err) {
          console.warn('Asset cache cleanup failed:', err);
        }
      };
      const start = async () => {
        const previousVersion = localStorage.getItem(storageKey);
        const startupParams = getStartupParams();
        const forceFreshClient = shouldForceFreshClient();
        const freshClientAlreadyDone = startupParams.get(freshClientDoneParam) === assetVersion;
        if (forceFreshClient && !freshClientAlreadyDone) {
          localStorage.setItem(storageKey, assetVersion);
          window.location.replace(buildFreshClientReloadUrl());
          return;
        }
        if (previousVersion !== assetVersion) {
          localStorage.setItem(storageKey, assetVersion);
          if (previousVersion) {
            await clearDashboardCaches();
          }
        }
        await loadModule(`js/shows.js?v=${assetVersion}`);
        loadModule(`js/main.js?v=${assetVersion}`).catch(err =>
          console.error('Dashboard app startup failed:', err)
        );
        afterIdle(() => {
          loadOptionalScript('https://cdn.jsdelivr.net/npm/chart.js');
        });
      };
      start().catch(err => console.error('Dashboard startup failed:', err));
    })();
  </script>
</body>
</html>
