name: Deploy Web

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Firebase Hosting target to deploy
        required: true
        default: staging
        type: choice
        options:
          - staging
          - prod

permissions:
  contents: read

jobs:
  deploy_staging:
    name: Deploy web staging
    if: github.event_name == 'push' || github.event.inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run validate
      - run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVE_EVENTS_6F3E5 }}
      - run: npx firebase-tools deploy --only functions,hosting:web-staging --project live-events-6f3e5
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json

  deploy_prod:
    name: Deploy web prod
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run validate:full
      - run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVE_EVENTS_6F3E5 }}
      - run: npx firebase-tools deploy --only functions,hosting:web-prod --project live-events-6f3e5
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
